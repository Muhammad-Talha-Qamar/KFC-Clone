<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css">
  <title>KFC Web Application</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons (pinned UMD build — @latest breaks / has no createIcons global) -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <style>
    /* Custom Scrollbars */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #c5c5c5; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

    /* Animated Underline Input Fields */
    .animated-input-container { position: relative; }
    .animated-input-line {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background-color: #e5002b;
      transition: width 0.3s ease-in-out;
    }
    .animated-input-container input:focus ~ .animated-input-line { width: 100%; }

    /* Active Order Button Border Style */
    .order-mode-btn.active {
      border: 2px solid #dc2626 !important;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }
    .order-mode-btn {
      border: 2px solid transparent;
    }

    /* Subtle Waving Animation for Colonel Sanders */
    @keyframes gentle-wave {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1.5deg); }
    }
    .colonel-anim {
      animation: gentle-wave 4s ease-in-out infinite;
    }
  </style>
</head>
<body id="body-container" class="bg-gray-100 font-sans transition-colors duration-300 min-h-screen flex flex-col relative overflow-x-hidden">

  <!-- TOAST NOTIFICATIONS CONTAINER -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- OVERLAY BACKGROUND FOR SIDEBAR -->
  <div id="overlay" onclick="closeSidebar()" class="fixed inset-0 bg-black/60 z-40 hidden transition-opacity duration-300"></div>

  <!-- SIDEBAR NAVIGATION DRAWER (HAMBURGER MENU) -->

    <div class="p-5 flex items-center justify-between border-b border-gray-800">
      <button onclick="navigateTo('login')" class="bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-2 rounded-md text-sm transition">
        LOGIN
      </button>

      <!-- Day / Night Toggle -->

        <button id="day-btn" onclick="setTheme('day')" class="px-3 py-1 text-xs font-bold rounded-full bg-red-600 text-white transition">Day</button>
        <button id="night-btn" onclick="setTheme('night')" class="px-3 py-1 text-xs font-bold rounded-full text-gray-400 hover:text-white transition">Night</button>
      </div>
    </div>

    <div class="px-4 py-6 border-b border-gray-800 space-y-4">

        <span>Store Locator</span>
      </button>
      <button onclick="navigateTo('track-order')" class="flex items-center gap-4 text-gray-200 hover:text-red-500 font-semibold text-base transition w-full text-left">
        <i data-lucide="truck" class="w-5 h-5 text-red-600"></i>
        <span>Track Order</span>

      <button onclick="navigateTo('home')" class="flex items-center gap-4 text-gray-200 hover:text-red-500 font-semibold text-base transition w-full text-left">
        <i data-lucide="utensils-crossed" class="w-5 h-5 text-red-600"></i>
        <span>Explore Menu</span>
      </button>

    <div class="px-6 py-6 space-y-4 text-sm font-medium text-gray-300">
      <a href="#" class="block hover:text-red-500 transition">About Us</a>
      <a href="#" class="block hover:text-red-500 transition">My Rewards</a>
      <a href="#" class="block hover:text-red-500 transition">Terms & Conditions</a>
      <a href="#" class="block hover:text-red-500 transition">Privacy Policy</a>
      <a href="#" class="block hover:text-red-500 transition">Contact Us</a>

  </aside>

        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" x2="20" y1="12" y2="12"></line>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    if (window.lucide) lucide.createIcons();

    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const toastContainer = document.getElementById('toast-container');

    // Offer banner carousel
    let bannerIndex = 0;
    let bannerTimer = null;
    const bannerTrack = document.getElementById('banner-track');
    const bannerDots = document.getElementById('banner-dots');
    const bannerSlides = bannerTrack ? bannerTrack.querySelectorAll('.banner-slide') : [];
    const bannerCount = bannerSlides.length;

    function buildBannerDots() {
      if (!bannerDots || !bannerCount) return;
      bannerDots.innerHTML = '';
      for (let i = 0; i < bannerCount; i++) {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'banner-dot' + (i === 0 ? ' active' : '');
        dot.setAttribute('aria-label', `Go to slide ${i + 1}`);
        dot.onclick = () => goToBanner(i);
        bannerDots.appendChild(dot);
      }
    }

    function updateBanner() {
      if (!bannerTrack || !bannerCount) return;
      bannerTrack.style.transform = `translateX(-${bannerIndex * 100}%)`;
      bannerDots.querySelectorAll('.banner-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === bannerIndex);
      });
    }

    function goToBanner(index) {
      bannerIndex = (index + bannerCount) % bannerCount;
      updateBanner();
      resetBannerTimer();
    }

    function nextBanner() {
      goToBanner(bannerIndex + 1);
    }

    function prevBanner() {
      goToBanner(bannerIndex - 1);
    }

    function resetBannerTimer() {
      clearInterval(bannerTimer);
      bannerTimer = setInterval(() => goToBanner(bannerIndex + 1), 4000);
    }

    buildBannerDots();
    resetBannerTimer();

    // Pause autoplay on hover
    const offerBanner = document.querySelector('.offer-banner');
    if (offerBanner) {
      offerBanner.addEventListener('mouseenter', () => clearInterval(bannerTimer));
      offerBanner.addEventListener('mouseleave', resetBannerTimer);
    }

    function setActiveOrderMode(selectedButton) {
      document.querySelectorAll('.order-mode-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      selectedButton.classList.add('active');
    }

    function toggleSidebar() {
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
    }

    function closeSidebar() {
      sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'bg-white border border-gray-200 rounded-lg p-3 shadow-xl flex items-center gap-3 text-xs font-semibold text-black pointer-events-auto min-w-[280px] animate-bounce';
      toast.innerHTML = `
        <div class="w-5 h-5 bg-red-100 rounded-full flex items-center justify-center text-red-600 font-bold shrink-0">!</div>
        <span class="flex-1">${message}</span>
        <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-black">✕</button>
      `;
      toastContainer.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 4000);
    }

    function handleReorder() {
      showToast("Please login first to reorder");
      setTimeout(() => {
        navigateTo('login');
      }, 800);
    }

    function submitLogin() {
      const phone = document.getElementById('login-phone').value;
      if (!phone) {
        showToast("Please enter a valid phone number");
      } else {
        showToast("Logging in...");
        setTimeout(() => {
          navigateTo('home');
        }, 1000);
      }
    }

    function handleTrackOrder() {
      const phone = document.getElementById('track-phone').value;
      const orderId = document.getElementById('track-id').value;

      if (!phone || !orderId) {
        showToast("Please enter both Phone Number and Order ID");
      } else {
        showToast("Searching for order status...");
      }
    }

    // Handles switching between screens seamlessly
    function navigateTo(viewId) {
      if (viewId === 'bucket') {
        window.location.href = './bucket.html';
        return;
      }
      closeSidebar();
      document.querySelectorAll('.page-view').forEach(view => view.classList.add('hidden'));
      
      const targetView = document.getElementById(`view-${viewId}`);
      if (targetView) {
        targetView.classList.remove('hidden');
      }
      window.scrollTo(0, 0);
    }

    function openBucket() {
      window.location.href = './bucket.html';
    }

    // ——— Cart / Bucket ———
    const MENU_ITEMS = [
      {
        id: 'krunch',
        name: 'Krunch Burger',
        price: 310,
        image: 'https://www.kfcpakistan.com/images/3df28210-0356-11f1-b8c8-9d1458b09f1f-KrunchBurger_variant_0-2026-02-06122036.png'
      },
      {
        id: 'mighty',
        name: 'Mighty Zinger',
        price: 770,
        image: 'https://www.kfcpakistan.com/images/479d9a50-033f-11f1-80f2-d9425fcae453-MightyBurger_variant_0-2026-02-06093614.png'
      },
      {
        id: 'chicken-chips',
        name: 'Chicken & Chips',
        price: 650,
        image: 'https://www.kfcpakistan.com/images/06430420-324a-11f1-853e-eb241d5d866b-Chicken%26Chips_variant_0-2026-04-07062133.png'
      },
      {
        id: 'hot-wings',
        name: 'Hot Wings Bucket',
        price: 670,
        image: 'https://www.kfcpakistan.com/images/58e39830-0cc4-11f1-b9bd-fd77d0888e9a-HotWingsBucket2_variant_0-2026-02-18122126.png'
      },
      {
        id: 'krunch-combo',
        name: 'Krunch Combo',
        price: 590,
        image: 'https://www.kfcpakistan.com/images/b5d21c10-0332-11f1-bced-37eb4037a5af-KrunchCombo-2026-02-06080615.png'
      },
      {
        id: 'snack-box',
        name: 'Snack Box',
        price: 1050,
        image: 'https://www.kfcpakistan.com/images/3cc0bb70-b524-11f1-9a2a-471ba44b3379-App-Web--Kiosk-Thumbnail-500x500-UPDATED-2026-09-20185106.png'
      }
    ];

    let cart = JSON.parse(localStorage.getItem('kfc-cart') || '[]');

    function saveCart() {
      localStorage.setItem('kfc-cart', JSON.stringify(cart));
      updateCartCounts();
    }

    function cartCount() {
      return cart.reduce((sum, item) => sum + item.qty, 0);
    }

    function updateCartCounts() {
      const count = cartCount();
      const fab = document.getElementById('fab-cart-count');
      const header = document.getElementById('header-cart-count');
      if (fab) fab.textContent = count;
      if (header) header.textContent = count;
    }

    function addToBucket(itemId) {
      const product = MENU_ITEMS.find(p => p.id === itemId);
      if (!product) return;
      const existing = cart.find(i => i.id === itemId);
      if (existing) existing.qty += 1;
      else cart.push({ ...product, qty: 1 });
      saveCart();
      showToast(`${product.name} added to bucket`);
    }

    function renderProductCard(item) {
      return `
        <div class="product-card">
          <img src="${item.image}" alt="${item.name}" onerror="this.src='https://www.kfcpakistan.com/images/58e39830-0cc4-11f1-b9bd-fd77d0888e9a-HotWingsBucket2_variant_0-2026-02-18122126.png'" />
          <div class="product-body">
            <div class="flex items-start justify-between gap-2">
              <h3 class="font-bold text-sm text-black leading-snug">${item.name}</h3>
              <span class="text-red-600 font-bold text-sm whitespace-nowrap">Rs ${item.price}</span>
            </div>
            <button type="button" class="add-btn" onclick="addToBucket('${item.id}')">Add to bucket</button>
          </div>
        </div>
      `;
    }

    function renderBestSellers() {
      const el = document.getElementById('best-sellers');
      if (!el) return;
      el.innerHTML = MENU_ITEMS.slice(0, 5).map(item => renderProductCard(item)).join('');
    }

    // ——— Draggable FAB ———
    (function initDraggableFab() {
      const fab = document.getElementById('draggable-fab');
      const link = fab?.querySelector('.cart-svg-link');
      if (!fab || !link) return;

      const BUCKET_URL = './bucket.html';
      let dragging = false;
      let moved = false;
      let startX = 0;
      let startY = 0;
      let origLeft = 0;
      let origTop = 0;

      function placeDefault() {
        const pad = 24;
        fab.style.left = `${window.innerWidth - fab.offsetWidth - pad}px`;
        fab.style.top = `${window.innerHeight - fab.offsetHeight - pad}px`;
        fab.style.right = 'auto';
        fab.style.bottom = 'auto';
      }

      placeDefault();
      window.addEventListener('resize', () => {
        const rect = fab.getBoundingClientRect();
        const maxX = window.innerWidth - fab.offsetWidth;
        const maxY = window.innerHeight - fab.offsetHeight;
        fab.style.left = `${Math.min(Math.max(0, rect.left), maxX)}px`;
        fab.style.top = `${Math.min(Math.max(0, rect.top), maxY)}px`;
      });

      fab.addEventListener('mouseenter', () => fab.classList.add('hovered'));
      fab.addEventListener('mouseleave', () => fab.classList.remove('hovered'));

      function onPointerDown(e) {
        if (e.button !== undefined && e.button !== 0) return;
        dragging = true;
        moved = false;
        fab.classList.add('dragging');
        const rect = fab.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        origLeft = rect.left;
        origTop = rect.top;
        fab.setPointerCapture?.(e.pointerId);
      }

      function onPointerMove(e) {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
        if (!moved) return; // don't reposition until a real drag
        const maxX = window.innerWidth - fab.offsetWidth;
        const maxY = window.innerHeight - fab.offsetHeight;
        fab.style.left = `${Math.min(Math.max(0, origLeft + dx), maxX)}px`;
        fab.style.top = `${Math.min(Math.max(0, origTop + dy), maxY)}px`;
      }

      function onPointerUp(e) {
        if (!dragging) return;
        dragging = false;
        fab.classList.remove('dragging');
        // pointerdown + preventDefault used to kill the click event —
        // open the bucket here on a tap/click (not a drag)
        if (!moved) {
          window.location.href = BUCKET_URL;
        }
        moved = false;
      }

      fab.addEventListener('pointerdown', onPointerDown);
      fab.addEventListener('pointermove', onPointerMove);
      fab.addEventListener('pointerup', onPointerUp);
      fab.addEventListener('pointercancel', onPointerUp);

      // Keep href for accessibility / middle-click; block default when we handle it
      link.addEventListener('click', (e) => {
        e.preventDefault();
      });
    })();

    renderBestSellers();
    updateCartCounts();

    function setTheme(theme) {
      const body = document.getElementById('body-container');
      const dayBtn = document.getElementById('day-btn');
      const nightBtn = document.getElementById('night-btn');
      const header = document.querySelector('header');
      const footer = document.querySelector('footer');
      const isNight = theme === 'night';

      body.classList.remove('bg-gray-100', 'bg-stone-900', 'theme-night');
      body.classList.add(isNight ? 'bg-stone-900' : 'bg-gray-100');
      if (isNight) body.classList.add('theme-night');

      if (header) {
        header.classList.toggle('bg-white', !isNight);
        header.classList.toggle('border-gray-200', !isNight);
        header.classList.toggle('bg-stone-800', isNight);
        header.classList.toggle('border-stone-700', isNight);
        header.classList.toggle('text-white', isNight);
      }

      if (footer) {
        footer.classList.toggle('bg-white', !isNight);
        footer.classList.toggle('border-gray-200', !isNight);
        footer.classList.toggle('bg-stone-800', isNight);
        footer.classList.toggle('border-stone-700', isNight);
        footer.classList.toggle('text-gray-300', isNight);
        footer.classList.toggle('text-gray-600', !isNight);
      }

      dayBtn.classList.toggle('bg-red-600', !isNight);
      dayBtn.classList.toggle('text-white', !isNight);
      dayBtn.classList.toggle('text-gray-400', isNight);

      nightBtn.classList.toggle('bg-red-600', isNight);
      nightBtn.classList.toggle('text-white', isNight);
      nightBtn.classList.toggle('text-gray-400', !isNight);

      localStorage.setItem('kfc-theme', theme);
    }

    // Restore saved theme on load
    (function initTheme() {
      const saved = localStorage.getItem('kfc-theme') || 'day';
      setTheme(saved);
    })();
  </script>
