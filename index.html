<!DOCTYPE html>

  <link rel="stylesheet" href="./style.css">
  <title>KFC Web Application</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons (pinned UMD build — @latest breaks / has no createIcons global) -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <style>
    /* Custom Scrollbars */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #c5c5c5; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

    /* Animated Underline Input Fields */
    .animated-input-container { position: relative; }
    .animated-input-line {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background-color: #e5002b;
      transition: width 0.3s ease-in-out;
    }
    .animated-input-container input:focus ~ .animated-input-line { width: 100%; }

    /* Active Order Button Border Style */
    .order-mode-btn.active {
      border: 2px solid #dc2626 !important;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }
    .order-mode-btn {
      border: 2px solid transparent;
    }

    /* Subtle Waving Animation for Colonel Sanders */
    @keyframes gentle-wave {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1.5deg); }
    }
    .colonel-anim {
      animation: gentle-wave 4s ease-in-out infinite;
    }
  </style>
</head>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    if (window.lucide) lucide.createIcons();

    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const toastContainer = document.getElementById('toast-container');

    // Offer banner carousel
    let bannerIndex = 0;
    let bannerTimer = null;
    const bannerTrack = document.getElementById('banner-track');
    const bannerDots = document.getElementById('banner-dots');
    const bannerSlides = bannerTrack ? bannerTrack.querySelectorAll('.banner-slide') : [];
    const bannerCount = bannerSlides.length;

    function buildBannerDots() {
      if (!bannerDots || !bannerCount) return;
      bannerDots.innerHTML = '';
      for (let i = 0; i < bannerCount; i++) {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'banner-dot' + (i === 0 ? ' active' : '');
        dot.setAttribute('aria-label', `Go to slide ${i + 1}`);
        dot.onclick = () => goToBanner(i);
        bannerDots.appendChild(dot);
      }
    }

    function updateBanner() {
      if (!bannerTrack || !bannerCount) return;
      bannerTrack.style.transform = `translateX(-${bannerIndex * 100}%)`;
      bannerDots.querySelectorAll('.banner-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === bannerIndex);
      });
    }

    function goToBanner(index) {
      bannerIndex = (index + bannerCount) % bannerCount;
      updateBanner();
      resetBannerTimer();
    }

    function nextBanner() {
      goToBanner(bannerIndex + 1);
    }

    function prevBanner() {
      goToBanner(bannerIndex - 1);
    }

    function resetBannerTimer() {
      clearInterval(bannerTimer);
      bannerTimer = setInterval(() => goToBanner(bannerIndex + 1), 4000);
    }

    buildBannerDots();
    resetBannerTimer();

    // Pause autoplay on hover

    // ——— Draggable FAB ———
    (function initDraggableFab() {
      const fab = document.getElementById('draggable-fab');
      const link = fab?.querySelector('.cart-svg-link');
      if (!fab || !link) return;

      const BUCKET_URL = './bucket.html';
      const MOBILE_MAX = 769;
      let dragging = false;
      let moved = false;
      let startX = 0;
      let startY = 0;
      let origLeft = 0;
      let origTop = 0;
      let userMoved = false;

      function isMobileBucket() {
        return window.innerWidth <= MOBILE_MAX;
      }

      /** Rest to CSS bottom-right (clears any drag inline coords). */
      function placeDefault() {
        userMoved = false;
        fab.style.left = '';
        fab.style.top = '';
        fab.style.right = '';
        fab.style.bottom = '';
      }

      function clampToViewport() {
        if (!isMobileBucket() || !fab.offsetWidth) return;
        const rect = fab.getBoundingClientRect();
        const maxX = Math.max(0, window.innerWidth - fab.offsetWidth);
        const maxY = Math.max(0, window.innerHeight - fab.offsetHeight);
        fab.style.left = `${Math.min(Math.max(0, rect.left), maxX)}px`;
        fab.style.top = `${Math.min(Math.max(0, rect.top), maxY)}px`;
        fab.style.right = 'auto';
        fab.style.bottom = 'auto';
      }

      placeDefault();
      window.addEventListener('resize', () => {
        if (!isMobileBucket()) {
          placeDefault();
          return;
        }
        if (userMoved) clampToViewport();
        else placeDefault();
      });

      fab.addEventListener('mouseenter', () => fab.classList.add('hovered'));
      fab.addEventListener('mouseleave', () => fab.classList.remove('hovered'));

      function onPointerDown(e) {
        if (!isMobileBucket()) return;
        if (e.button !== undefined && e.button !== 0) return;
        dragging = true;
        moved = false;
        fab.classList.add('dragging');
        const rect = fab.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        origLeft = rect.left;
        origTop = rect.top;
        // Lock to left/top so drag works from CSS right/bottom start
        fab.style.left = `${rect.left}px`;
        fab.style.top = `${rect.top}px`;
        fab.style.right = 'auto';
        fab.style.bottom = 'auto';
        fab.setPointerCapture?.(e.pointerId);
      }

      function onPointerMove(e) {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
        if (!moved) return;
        userMoved = true;
        const maxX = Math.max(0, window.innerWidth - fab.offsetWidth);
        const maxY = Math.max(0, window.innerHeight - fab.offsetHeight);
        fab.style.left = `${Math.min(Math.max(0, origLeft + dx), maxX)}px`;
        fab.style.top = `${Math.min(Math.max(0, origTop + dy), maxY)}px`;
      }

      function onPointerUp() {
        if (!dragging) return;
        dragging = false;
        fab.classList.remove('dragging');
        if (!moved) {
          window.location.href = BUCKET_URL;
        }
        moved = false;
      }

      fab.addEventListener('pointerdown', onPointerDown);
      fab.addEventListener('pointermove', onPointerMove);
      fab.addEventListener('pointerup', onPointerUp);
      fab.addEventListener('pointercancel', onPointerUp);

      link.addEventListener('click', (e) => {
        e.preventDefault();
      });
    })();

    function setTheme(theme) {
      const body = document.getElementById('body-container');
      const dayBtn = document.getElementById('day-btn');
      const nightBtn = document.getElementById('night-btn');
      const header = document.querySelector('header');
      const footer = document.querySelector('footer');
      const isNight = theme === 'night';

      body.classList.remove('bg-gray-100', 'bg-stone-900', 'theme-night');
      body.classList.add(isNight ? 'bg-stone-900' : 'bg-gray-100');
      if (isNight) body.classList.add('theme-night');

      if (header) {
        header.classList.toggle('bg-white', !isNight);
        header.classList.toggle('border-gray-200', !isNight);
        header.classList.toggle('bg-stone-800', isNight);
        header.classList.toggle('border-stone-700', isNight);
        header.classList.toggle('text-white', isNight);
      }

      if (footer) {
        footer.classList.toggle('bg-white', !isNight);
        footer.classList.toggle('border-gray-200', !isNight);
        footer.classList.toggle('bg-stone-800', isNight);
        footer.classList.toggle('border-stone-700', isNight);
        footer.classList.toggle('text-gray-300', isNight);
        footer.classList.toggle('text-gray-600', !isNight);
      }

      dayBtn.classList.toggle('bg-red-600', !isNight);
      dayBtn.classList.toggle('text-white', !isNight);
      dayBtn.classList.toggle('text-gray-400', isNight);

      nightBtn.classList.toggle('bg-red-600', isNight);
      nightBtn.classList.toggle('text-white', isNight);
      nightBtn.classList.toggle('text-gray-400', !isNight);

      localStorage.setItem('kfc-theme', theme);

    let selectedOutletName = localStorage.getItem('kfc-selected-store') || '';

    function renderStores(list) {
      const container = document.getElementById('store-list');
      if (!container) return;
      container.innerHTML = '';

      if (!list.length) {
        container.innerHTML = '<p class="text-sm text-gray-500 text-center py-6">No KFC outlets found matching your query.</p>';
        return;
      }

      list.forEach((store, index) => {
        const isSelected = selectedOutletName === store.name || (!selectedOutletName && index === 0);
        const card = document.createElement('div');
        card.className = isSelected
          ? 'p-4 border border-red-500 bg-red-50/20 rounded-lg transition cursor-pointer flex items-start gap-3'
          : 'p-4 border border-gray-200 rounded-lg hover:border-red-500 transition cursor-pointer flex items-start gap-3 bg-white';
        card.onclick = () => selectStore(store.name);
        card.innerHTML = `
          <i data-lucide="map-pin" class="w-5 h-5 text-red-600 shrink-0 mt-1"></i>
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <h3 class="font-bold text-black text-sm">${store.name}</h3>
              <span class="text-[10px] font-semibold uppercase tracking-wide text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded">${store.city}</span>
            </div>
            <p class="text-xs text-gray-500 mt-0.5">${store.address}</p>
            <p class="text-xs font-bold text-red-600 mt-1">${store.timing}</p>
          </div>
        `;
        container.appendChild(card);
      });

      if (window.lucide) lucide.createIcons();
    }

    function filterStores() {
      const searchEl = document.getElementById('store-search');
      const cityEl = document.getElementById('city-select');
      const searchQuery = (searchEl?.value || '').toLowerCase().trim();
      const selectedCity = cityEl?.value || 'All';

      const filtered = OUTLETS.filter(store => {
        const matchesCity = selectedCity === 'All' || store.city === selectedCity;
        const matchesQuery =
          !searchQuery ||
          store.name.toLowerCase().includes(searchQuery) ||
          store.address.toLowerCase().includes(searchQuery) ||
          store.city.toLowerCase().includes(searchQuery);
        return matchesCity && matchesQuery;
      });

      renderStores(filtered);
    }

    function selectStore(storeName) {
      selectedOutletName = storeName;
      localStorage.setItem('kfc-selected-store', storeName);
      const label = document.getElementById('selected-store-label');
      if (label) label.textContent = storeName;
      filterStores();
      showToast(`Selected Store: ${storeName}`);
    }

    // Restore saved theme on load
    (function initTheme() {
      const saved = localStorage.getItem('kfc-theme') || 'day';
      setTheme(saved);
    })();

    // Init store list + header pickup label
    (function initStores() {
      if (selectedOutletName) {
        const label = document.getElementById('selected-store-label');
        if (label) label.textContent = selectedOutletName;
      }
      filterStores();
    })();
  </script>
